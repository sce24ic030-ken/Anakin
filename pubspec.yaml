name: anakin_web_oracle
description: "Anakin Web Oracle - AI-powered web analysis app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  webview_flutter: ^4.4.0
  image_picker: ^1.0.7
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^7.2.2
  fl_chart: ^0.66.2
  mobile_scanner: ^5.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  min_sdk_android: 21